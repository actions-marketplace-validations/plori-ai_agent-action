name: Plori persistent agent review
description: Review a pull request in a persistent remote workspace that can check out code and run tests.
author: Plori
branding:
  icon: terminal
  color: purple

inputs:
  mode:
    description: Run the agent or publish its already-produced result as one PR comment.
    required: false
    default: agent
  prompt:
    description: Extra review instructions appended to the safe default prompt.
    required: false
  api-base:
    description: Plori API origin. Override only for a trusted self-hosted control plane.
    required: false
    default: https://api.plori.ai
  site-base:
    description: Plori web origin used for the live agent link.
    required: false
    default: https://plori.ai
  repository-token:
    description: Job-lifetime contents:read token used by the agent to check out the repository.
    required: true
  plori-api-key:
    description: Optional plori_sk_ API key. The GitHub OIDC exchange connects the repository to this key's Plori account. The API-key fallback requires this key and agent-id.
    required: false
  agent-id:
    description: Agent UUID required with plori-api-key for the GitHub Enterprise Server fallback. Leave it unset on github.com.
    required: false
  timeout-seconds:
    description: Maximum time to wait for the remote review, including the wait for an earlier review of the same repository.
    required: false
    default: "2100"
  poll-interval-seconds:
    description: Delay between durable result polls.
    required: false
    default: "3"
  result:
    description: Review Markdown to publish in comment mode.
    required: false
  outcome:
    description: Agent outcome to publish in comment mode.
    required: false
  claim-url:
    description: Repository setup URL to publish in comment mode.
    required: false

outputs:
  review:
    description: Final review Markdown, or a notice that repository setup is required.
  outcome:
    description: succeeded, claim_required, cancelled, or failed.
  claim-url:
    description: Setup page URL for connecting the repository to a Plori account.
  run-id:
    description: Plori run identifier when an agent run started.
  session-id:
    description: Persistent Plori conversation identifier for this run.
  agent-url:
    description: Deep link to the live Plori agent session.

runs:
  using: node24
  main: index.mjs
